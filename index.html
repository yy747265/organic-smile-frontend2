<script>
const PUBLIC_API_URL = "https://organic-smile-public-api.vercel.app/api/products";

document.addEventListener("DOMContentLoaded", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const productName = urlParams.get("name");

    if (!productName) return;

    try {
        const response = await fetch(PUBLIC_API_URL);
        const products = await response.json();

        // البحث عن المنتج بالاسم
        const product = products.find(p => p.name === decodeURIComponent(productName));

        if (product) {
            // عرض اسم المنتج
            const nameEl = document.getElementById("productTitle") || document.getElementById("productName");
            if (nameEl) nameEl.textContent = product.name;

            // عرض الصورة
            const imgEl = document.getElementById("mainImg") || document.getElementById("productImg");
            if (imgEl && product.images && product.images[0]) {
                imgEl.src = product.images[0];
            }

            // عرض الأحجام والأسعار
            const sizesContainer = document.getElementById("productSizes") || document.getElementById("sizesBox");
            if (sizesContainer && Array.isArray(product.sizes)) {
                sizesContainer.innerHTML = "";
                product.sizes.forEach((item, index) => {
                    let sName = typeof item === 'object' ? item.size : item;
                    let sPrice = typeof item === 'object' ? item.price + " ج.م" : "";

                    const btn = document.createElement("button");
                    btn.className = "size-btn";
                    btn.style.cssText = "padding: 8px 16px; margin: 4px; border: 1px solid #C9A961; background: #000; color: #fff; border-radius: 8px; cursor: pointer;";
                    btn.innerHTML = `${sName} - <strong>${sPrice}</strong>`;
                    sizesContainer.appendChild(btn);
                });
            }
        }
    } catch (err) {
        console.error("Error loading product details:", err);
    }
});
</script>
