<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pTitle">تفاصيل المنتج | ORGANIC Smile</title>
    <meta name="theme-color" content="#0b0b0a">
    <link rel="icon" href="images/logo.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط الإعلانات المتحرك -->
    <div class="topbar" id="adsBar" aria-label="ads"></div>

    <header class="navbar">
        <button class="menu-toggle" id="menuToggle" data-i18n-aria="menu" aria-label="القائمة">
            <i class="fa-solid fa-bars"></i>
        </button>

        <a href="index.html" class="logo">ORGANIC <span>Smile</span></a>

        <nav class="nav-links" id="navLinks">
            <a href="index.html" data-i18n="navHome">الرئيسية</a>
            <a href="index.html#featured-products" class="active" data-i18n="navShop">المتجر</a>
            <a href="index.html#about" data-i18n="navAbout">قصتنا</a>
            <a href="index.html#contact" data-i18n="navContact">تواصل معنا</a>
        </nav>

        <button type="button" class="lang-toggle" id="langToggle">EN</button>

        <a href="index.html#contact" class="nav-cta">
            <i class="fa-brands fa-whatsapp"></i>
            <span data-i18n="orderNow">اطلب الآن</span>
        </a>
    </header>

    <main class="product-page">
        <a href="index.html#featured-products" class="back-link">
            <i class="fa-solid fa-arrow-right"></i> <span data-i18n="backShop">العودة للمتجر</span></a>

        <div class="product-detail">
            <div class="detail-gallery">
                <div class="detail-img-wrap">
                    <img id="detailImg" src="" alt="صورة المنتج">
                </div>
                <div class="detail-thumbs" id="detailThumbs"></div>
            </div>

            <div class="detail-info">
                <span class="product-cat" id="detailCat"></span>
                <h1 id="detailTitle"></h1>
                <div class="detail-price" id="detailPrice"></div>
                <p class="detail-desc" id="detailDesc"></p>

                <div id="sizesBlock" style="display:none;">
                    <div class="sizes-label" data-i18n="sizesLabel">الأحجام المتاحة</div>
                    <div class="size-options" id="detailSizes"></div>
                </div>

                <div class="detail-actions">
                    <button type="button" id="addBtn" class="btn btn-gold" style="display:none;">
                        <i class="fa-solid fa-basket-shopping"></i> <span data-i18n="addToCart">أضف للسلة</span></button>
                    <a id="orderBtn" class="btn btn-outline" style="display:none;" target="_blank" rel="noopener">
                        <i class="fa-brands fa-whatsapp"></i> <span data-i18n="orderWA">اطلب عبر واتساب</span></a>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-logo">ORGANIC <span>Smile</span></div>
        <p data-i18n="footerP">طبيعي 100% · طعم فاخر وجودة لا تضاهى</p>
        <div class="footer-bottom" data-i18n="footerBottom">© 2026 ORGANIC Smile. جميع الحقوق محفوظة.</div>
    </footer>

    <script src="script.js"></script>
    </body>
</html>
