<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | ORGANIC Smile</title>
    <meta name="theme-color" content="#0b0b0a">
    <link rel="icon" href="images/logo.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">
            <i class="fa-solid fa-bars"></i>
        </button>

        <a href="index.html" class="logo">ORGANIC <span>Smile</span></a>

        <nav class="nav-links" id="navLinks">
            <a href="index.html">الرئيسية</a>
            <a href="index.html#featured-products" class="active">المتجر</a>
            <a href="index.html#about">قصتنا</a>
            <a href="index.html#contact">تواصل معنا</a>
        </nav>

        <a href="index.html#contact" class="nav-cta">
            <i class="fa-brands fa-whatsapp"></i>
            <span>اطلب الآن</span>
        </a>
    </header>

    <main class="product-page">
        <a href="index.html#featured-products" class="back-link">
            <i class="fa-solid fa-arrow-right"></i> العودة للمتجر
        </a>

        <div class="product-detail">
            <div class="detail-gallery">
                <div class="detail-img-wrap">
                    <img id="detailImg" src="" alt="صورة المنتج">
                </div>
                <div class="detail-thumbs" id="detailThumbs"></div>
            </div>

            <div class="detail-info">
                <span class="product-cat" id="detailCat"></span>
                <h1 id="detailTitle">جاري تحميل المنتج...</h1>
                <div class="detail-price" id="detailPrice"></div>
                <p class="detail-desc" id="detailDesc"></p>

                <div id="sizesBlock" style="display:none;">
                    <div class="sizes-label">الأحجام المتاحة</div>
                    <div class="size-options" id="detailSizes"></div>
                </div>

                <a id="orderBtn" class="btn btn-gold btn-block" style="display:none;" target="_blank" rel="noopener">
                    <i class="fa-brands fa-whatsapp"></i> اطلب عبر واتساب
                </a>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-logo">ORGANIC <span>Smile</span></div>
        <p>طبيعي 100% · طعم فاخر وجودة لا تضاهى</p>
        <div class="footer-bottom">&copy; 2026 ORGANIC Smile. جميع الحقوق محفوظة.</div>
    </footer>

    <script src="script.js"></script>
    <script>
    const $ = (id) => document.getElementById(id);

    document.addEventListener("DOMContentLoaded", loadProduct);

    async function loadProduct() {
        $("detailImg").src = PLACEHOLDER_IMG;

        const name = (new URLSearchParams(window.location.search).get("name") || "").trim();
        if (!name) {
            showMessage("لم يتم تحديد منتج", "ارجع للمتجر واختار المنتج اللي يعجبك.");
            return;
        }

        try {
            const products = await fetchProducts();
            const product = products.find((p) => String(p.name || "").trim() === name);
            if (!product) {
                showMessage("المنتج غير موجود", "ممكن يكون المنتج اتشال أو الرابط غلط.");
                return;
            }
            renderProduct(product);
        } catch (err) {
            console.error(err);
            showMessage("تعذر تحميل بيانات المنتج", "تأكد من الاتصال وحدّث الصفحة.");
        }
    }

    function showMessage(title, text) {
        $("detailTitle").textContent = title;
        $("detailDesc").textContent = text;
        $("detailCat").textContent = "";
        $("detailPrice").textContent = "";
    }

    function renderProduct(product) {
        const name = String(product.name);

        document.title = name + " | ORGANIC Smile";
        $("detailTitle").textContent = name;
        $("detailCat").textContent = categoryLabel(product.category);
        $("detailDesc").textContent =
            product.description || "منتج طبيعي فاخر 100% بدون أي إضافات صناعية.";

        // ----- الصور -----
        const images = getImages(product);
        const main = $("detailImg");
        main.alt = name;
        main.src = images[0];
        main.addEventListener("error", () => { main.src = PLACEHOLDER_IMG; }, { once: true });

        const thumbs = $("detailThumbs");
        thumbs.innerHTML = "";
        if (images.length > 1) {
            images.forEach((src, i) => {
                const t = document.createElement("img");
                t.src = src;
                t.alt = name + " " + (i + 1);
                if (i === 0) t.classList.add("active");
                t.addEventListener("click", () => {
                    main.src = src;
                    thumbs.querySelectorAll("img").forEach((x) => x.classList.remove("active"));
                    t.classList.add("active");
                });
                thumbs.appendChild(t);
            });
        }

        // ----- الأحجام والسعر -----
        const sizes = normalizeSizes(product);
        let selected = sizes[0] || null;

        function update() {
            const hasPrice = selected && selected.price !== null;
            $("detailPrice").textContent = hasPrice ? formatPrice(selected.price) : "تواصل معنا لمعرفة السعر";

            let msg = "مرحباً، أريد طلب: " + name;
            if (selected && selected.size) msg += " - الحجم: " + selected.size;
            if (hasPrice) msg += " - السعر: " + formatPrice(selected.price);
            $("orderBtn").href = whatsappLink(msg);
        }

        const showSizes = sizes.some((s) => s.size);
        $("sizesBlock").style.display = showSizes ? "" : "none";

        if (showSizes) {
            const box = $("detailSizes");
            box.innerHTML = "";
            sizes.forEach((s, i) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "size-btn" + (i === 0 ? " active" : "");
                btn.textContent = s.size + (s.price !== null ? " - " + formatPrice(s.price) : "");
                btn.addEventListener("click", () => {
                    box.querySelectorAll(".size-btn").forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    selected = s;
                    update();
                });
                box.appendChild(btn);
            });
        }

        update();
        $("orderBtn").style.display = "inline-flex";
    }
    </script>
</body>
</html>
